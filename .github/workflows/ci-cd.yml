name: ShopPilot CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  GCP_REGION: us-central1
  SERVICE_NAME: shoppilot

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check shoppilot app tests

      - name: Typecheck with Mypy
        run: mypy shoppilot app

      - name: Run unit & integration tests
        run: pytest --cov=shoppilot --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Verify Docker build
        run: docker build -t shoppilot:ci .

  deploy:
    name: Deploy to Cloud Run & Sync Agent Registry
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Container
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/shoppilot/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/shoppilot/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: >-
            --service-account=shoppilot-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --no-allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --memory=1Gi
            --cpu=2
          env_vars: |
            APP_ENV=production
            GOOGLE_GENAI_USE_VERTEXAI=TRUE
            GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=${{ env.GCP_REGION }}
            ENABLE_CLOUD_TRACE=true
            REQUIRE_AUTH=true

      - name: Update PUBLIC_BASE_URL & Smoke Test
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --update-env-vars="PUBLIC_BASE_URL=${SERVICE_URL}"
          ID_TOKEN=$(gcloud auth print-identity-token)
          curl -fsS -H "Authorization: Bearer ${ID_TOKEN}" "${SERVICE_URL}/healthz"
          curl -fsS -H "Authorization: Bearer ${ID_TOKEN}" "${SERVICE_URL}/.well-known/agent-card.json" | grep -q "ShopPilot"
