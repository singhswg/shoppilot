# ==============================================================================
# Google Cloud Build CI/CD Pipeline for ShopPilot
# Runs: Lint -> Unit Tests -> Container Build -> Push -> Cloud Run Deploy -> Smoke Test
# ==============================================================================

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: shoppilot
  _AR_REPO: shoppilot
  _SERVICE_ACCOUNT: shoppilot-sa@${PROJECT_ID}.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # 1. Lint & Unit Tests
  - id: lint-and-test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        pip install --no-cache-dir -e ".[dev]"
        ruff check shoppilot app tests
        pytest --cov=shoppilot --cov=app --cov-fail-under=70

  # 2. Build Container Image
  - id: build-image
    name: gcr.io/cloud-builders/docker
    waitFor: ["lint-and-test"]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest
      - .

  # 3. Push Image to Artifact Registry
  - id: push-image
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-image"]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}

  # 4. Deploy to Cloud Run (authenticated by default)
  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ["push-image"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_SERVICE_ACCOUNT}
      - --no-allow-unauthenticated
      - --min-instances=0
      - --max-instances=10
      - --memory=1Gi
      - --cpu=2
      - --set-env-vars=APP_ENV=production,GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},ENABLE_CLOUD_TRACE=true,REQUIRE_AUTH=true

  # 5. Post-deploy Smoke Test (Health + A2A Agent Card)
  - id: smoke-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ["deploy-cloud-run"]
    entrypoint: bash
    args:
      - -ceu
      - |
        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
        ID_TOKEN=$(gcloud auth print-identity-token)
        echo "Smoke testing ${SERVICE_URL}..."
        curl -fsS -H "Authorization: Bearer ${ID_TOKEN}" "${SERVICE_URL}/healthz"
        curl -fsS -H "Authorization: Bearer ${ID_TOKEN}" "${SERVICE_URL}/.well-known/agent-card.json" | grep -q "ShopPilot"
        echo "Smoke test passed!"

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest
